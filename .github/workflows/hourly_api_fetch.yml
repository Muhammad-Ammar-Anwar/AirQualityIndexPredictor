name: AQI Hourly Pipeline

on:
  schedule:
    - cron: "10 * * * *"   # Every hour at :10
  workflow_dispatch:

jobs:
  run-hourly-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MONGODB_URI:                 ${{ secrets.MONGODB_URI }}
      MONGODB_DB:                  ${{ secrets.MONGODB_DB }}
      MONGODB_COLLECTION:          ${{ secrets.MONGODB_COLLECTION }}
      MONGODB_FEATURES_COLLECTION: ${{ secrets.MONGODB_FEATURES_COLLECTION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from dotenv import load_dotenv; print('dotenv OK')"

      - name: Run hourly pipeline
        run: python hourly_pipeline.py

      - name: Trigger backend snapshot refresh
        # 1. Wake the Hugging Face Space (free tier sleeps after inactivity).
        # 2. Call /api/ingest-trigger — backend fetches the new MongoDB data,
        #    runs the forecast, and caches everything in memory so the frontend
        #    gets instant responses on the next poll.
        run: |
          BACKEND="https://ammaranwar-aqi-backend.hf.space"
          echo "Waking up backend..."
          curl -sf --retry 5 --retry-delay 10 --retry-connrefused "$BACKEND/health" || true
          echo "Triggering snapshot rebuild..."
          RESPONSE=$(curl -sf -X POST "$BACKEND/api/ingest-trigger" || echo '{"status":"failed"}')
          echo "Backend response: $RESPONSE"
