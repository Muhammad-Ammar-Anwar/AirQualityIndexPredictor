name: 🌤️ Hourly Weather & Air Quality Ingestion to Hopsworks_V3

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1️⃣ Checkout repository
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set timezone
      - name: 🌍 Set timezone to Asia/Karachi
        run: |
          sudo timedatectl set-timezone Asia/Karachi
          echo "🕒 Current runner time (Karachi):"
          date

      # 3️⃣ Setup Python
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4️⃣ Debug repository structure
      - name: 🔍 List repo files
        run: |
          echo "📂 Repository structure:"
          ls -R

      # 5️⃣ Install dependencies
      - name: ⚙️ Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          echo "📦 Upgrading pip..."
          python -m pip install --upgrade pip setuptools wheel

          echo "📦 Installing project requirements..."
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          echo "📦 Installing Hopsworks compatible packages..."
          pip install "hopsworks==4.7.*"
          pip install confluent-kafka
          pip install pandas requests python-dotenv pyarrow pytz

      # 6️⃣ Run ingestion script
      - name: 🚀 Run Weather & Air Quality Ingestion
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          echo "🌍 Starting weather and AQ ingestion..."
          python Data_Ingested_hopswork_pushed.py
          echo "✅ Data ingestion completed!"

      # 7️⃣ Workflow summary
      - name: ✅ Job Summary
        run: |
          echo "🎯 Weather & pollutant data ingestion completed at $(date)"
          echo "🧠 Timezone: Asia/Karachi"
          echo "📊 Check your Hopsworks dashboard for uploaded data."