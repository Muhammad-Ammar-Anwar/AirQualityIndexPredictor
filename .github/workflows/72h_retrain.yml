name: Retrain AQI Model (every 12h)

on:
  schedule:
    - cron: "30 */12 * * *"   # 00:30 and 12:30 UTC — 20 min after hourly pipeline
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MONGODB_URI:                 ${{ secrets.MONGODB_URI }}
      MONGODB_DB:                  ${{ secrets.MONGODB_DB }}
      MONGODB_COLLECTION:          ${{ secrets.MONGODB_COLLECTION }}
      MONGODB_FEATURES_COLLECTION: ${{ secrets.MONGODB_FEATURES_COLLECTION }}
      MODEL_DB:                    ${{ secrets.MODEL_DB }}
      MODEL_COL:                   ${{ secrets.MODEL_COL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dateutil
          python -c "from dotenv import load_dotenv; print('dotenv OK')"
          python -c "import lightgbm; print('lightgbm OK')"

      - name: Fetch + engineer features (Complete Pipeline)
        run: python Complete_Pipeline.py

      - name: Train + save models (Retrain Pipeline)
        run: python Model_Retrain_pipeline.py
