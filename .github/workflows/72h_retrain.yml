name: Retrain AQI Model (every 12h)

on:
  schedule:
    - cron: "30 */12 * * *"   # Every 12 hours (00:30 and 12:30 UTC) — 20 min after hourly
  workflow_dispatch:           # Allow manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
      MODEL_DB: ${{ secrets.MODEL_DB }}
      MODEL_COL: ${{ secrets.MODEL_COL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pymongo lightgbm scikit-learn pandas numpy

      - name: Run retrain pipeline
        run: python Model_Retrain_pipeline.py
